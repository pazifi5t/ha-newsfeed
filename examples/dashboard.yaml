# Newsfeed – Beispiel-Dashboard
# Ansicht bearbeiten → ⋮ → Raw-Konfigurationseditor, oder einzelne Karten
# über „Karte hinzufügen → Manuell“ einfügen.
#
# Die Entity-IDs hängen von der Systemsprache ab, in der Home Assistant beim
# Einrichten der Integration lief:
#
#   Englisch                          Deutsch
#   select.newsfeed_topic             select.newsfeed_thema
#   select.newsfeed_period            select.newsfeed_zeitraum
#   sensor.newsfeed_selected_news     sensor.newsfeed_ausgewahlte_news
#   sensor.newsfeed_it / _politik / _jagd / _metal  (in beiden Sprachen gleich)
#
# Dieses Beispiel nutzt die englischen IDs. Die genaue ID siehst du unter
# Einstellungen → Geräte & Dienste → Entitäten → Entität → Zahnrad.

title: News
views:
  - title: News
    path: news
    icon: mdi:newspaper-variant-outline
    cards:
      # Thema und Zeitraum umschalten, darunter die Artikel des gewählten Themas
      - type: vertical-stack
        cards:
          - type: grid
            columns: 2
            square: false
            cards:
              - type: tile
                entity: select.newsfeed_topic
                features:
                  - type: select-options
              - type: tile
                entity: select.newsfeed_period
                features:
                  - type: select-options
          - type: markdown
            content: |
              {% set s = 'sensor.newsfeed_selected_news' %}
              {% for a in state_attr(s, 'articles') or [] %}
              {% if a.image %}<img src="{{ a.image }}" width="100%">{% endif %}
              {{ '⭐ ' if a.top else '' }}**[{{ a.title }}]({{ a.link }})**<br>
              <small>{{ a.source }}{% if a.published %} · {{ as_timestamp(a.published) | timestamp_custom('%H:%M') }}{% endif %}</small>
              {% if a.summary %}<br><small>{{ a.summary }}</small>{% endif %}

              ---
              {% else %}
              _Keine Artikel im gewählten Zeitraum._
              {% endfor %}
              {% if state_attr(s, 'unavailable_sources') %}
              <small>⚠️ Nicht erreichbar: {{ state_attr(s, 'unavailable_sources') | join(', ') }}</small>
              {% endif %}

  # Kompakte Variante: alle Themen nebeneinander, nur Überschriften
  # (gut fürs Wandpanel zum Überfliegen)
  - title: Alle Themen
    path: news-alle
    type: sections
    sections:
      - type: grid
        cards:
          - type: markdown
            title: IT
            content: |
              {% for a in state_attr('sensor.newsfeed_it', 'articles') or [] %}
              {{ '⭐ ' if a.top else '' }}[{{ a.title }}]({{ a.link }})<br>
              <small>{{ a.source }}</small>

              {% endfor %}
      - type: grid
        cards:
          - type: markdown
            title: Politik
            content: |
              {% for a in state_attr('sensor.newsfeed_politik', 'articles') or [] %}
              {{ '⭐ ' if a.top else '' }}[{{ a.title }}]({{ a.link }})<br>
              <small>{{ a.source }}</small>

              {% endfor %}
      - type: grid
        cards:
          - type: markdown
            title: Jagd
            content: |
              {% for a in state_attr('sensor.newsfeed_jagd', 'articles') or [] %}
              [{{ a.title }}]({{ a.link }})<br>
              <small>{{ a.source }}</small>

              {% endfor %}
      - type: grid
        cards:
          - type: markdown
            title: Metal
            content: |
              {% for a in state_attr('sensor.newsfeed_metal', 'articles') or [] %}
              [{{ a.title }}]({{ a.link }})<br>
              <small>{{ a.source }}</small>

              {% endfor %}
